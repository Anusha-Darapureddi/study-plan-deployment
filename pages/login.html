<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/home">MyApp</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/home">Home</a>
        </li>
      </ul>

      <div class="d-flex">
        <a href="/login" class="btn btn-outline-light me-2">Login</a>
        <a href="/signup" class="btn btn-warning">Sign Up</a>
      </div>
    </div>
  </div>
</nav>

<!-- Login Form -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Login</h3>

          <form method="POST" action="/login">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
              <input id="password" type="password" name="password" class="form-control" required>
              <span class="input-group-text" id="togglepassword" style="cursor:pointer;"> 👁️</span>
            </div>
           </div>
           
            <div class="d-grid">
              <button id="submit" type="button" class="btn btn-warning">
                Login
              </button>
            </div>
          </form>

          <p class="text-center mt-3 mb-0">
            Don’t have an account?
            <a href="/signup">Sign Up</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
        const passwordinput=document.getElementById("password")
        const toggle=document.getElementById('togglepassword')
         toggle.addEventListener("click",()=>{
          password.type=password.type==="password"?"text":"password"
          toggle.textContent=password.type==="password"?"👁️":"👁️"//represents show hide
        })

   async function postData(url='',data={}){
        const response=await fetch(url,{
            method:"post",
            headers:{
                'content-type':'application/json'
            },
            body:JSON.stringify(data)
        })
        let rdata=await response.json()
        return rdata

    }
    const submit=document.getElementById('submit')
    submit.addEventListener("click",async()=>{
        const email=document.getElementById("email").value
        const password=document.getElementById("password").value
        
        console.log("submitting this data",email,password)
        let resp=await postData('https://study-plan-45v4.onrender.com/login',{email,password})
        if(resp.success){
          alert("you are logged in")
          localStorage.setItem("user",JSON.stringify({email:resp.loginuser}))
          window.location.href="/home"
          console.log(localStorage.getItem('user'))
          }
        
    })
</script>
</body>
</html>
