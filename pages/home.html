<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyApp</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
      </ul>

      <!-- Right side buttons -->
      <div class="d-flex">
        <a href="/login" class="btn btn-outline-light me-2">Login</a>
        <a href="/signup" class="btn btn-warning">Sign Up</a>
      </div>
    </div>
  </div>
</nav>


<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <!-- Add Study Plan Card -->
      <div class=" card shadow-sm rounded-4 mb-4 ">
        <div class="card-body">
          <h5 class="text-center mb-4">Study Planner</h5>

          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" id="subject" class="form-control" placeholder="Enter subject">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" id="date" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Time</label>
              <input type="time" id="time" class="form-control">
            </div>
          </div>

          <div class="d-grid">
            <button class="btn btn-primary rounded-pill" id="addnote">
              Add Plan
            </button>
          </div>
        </div>
      </div>

      <!-- Study Plans List -->
     <div class="card shadow-sm rounded-4">
        <div class="card-body">
          <h6 class="mb-3">Upcoming Plans</h6>
          <ul class="list-group list-group-flush mynotes"></ul>
         </div>
         </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  async function postData(url='',data={}){
    const response=await fetch(url,{
      method:'post',
      headers:{
        'content-type':'application/json'
      },
      body:JSON.stringify(data)
    })
    let rdata=await response.json()
    return rdata
  }

  const userData=localStorage.getItem('user')
  if(!userData){
    console.log("user not found")
  }
  else{
    const user=JSON.parse(userData)
    postData('/getnotes',{email:user.email})
   .then(data=>{
     let notes=data.notes || []
     let noteContainer=document.querySelector(".mynotes")
     noteContainer.innerHTML=""
     notes.forEach(element=>{

    const isCompleted=localStorage.getItem(`task_${element._id}`)==="completed"//we clicked but it is disappeared when we refresh so for that this line
   


     let note=`
       <li class="list-group-item border-0 mb-4 p-4 shadow rounded-4 d-flex justify-content-between align-items-center"
    style="
      background: ${isCompleted
        ? 'linear-gradient(135deg,#d4edda,#c3e6cb)'
        : 'linear-gradient(135deg,#fdfbfb,#ebedee)'
      };
      border: ${isCompleted ? '2px solid #28a745' : 'none'};
    ">
  
    <div class="d-flex align-items-center gap-4">
   
    <div class="rounded-circle d-flex align-items-center justify-content-center"
         style="width:55px;height:55px;
                background:linear-gradient(135deg,#667eea,#764ba2);
                color:white;
                font-size:24px;">
      📚
    </div>

   
    <div>
      <div class="fw-bold fs-5 text-dark">
        ${element.subject}
      </div>

      <div class="mt-1 fw-semibold text-secondary">
        ⏰ ${element.date} &nbsp;•&nbsp; ${element.time}
      </div>
      <button class="btn btn-outline-danger btn-sm rounded-circle"
        onclick="deleteNote('${element._id}')">
      🗑️
     </button>
    </div>
  </div>
  
       <div class="d-flex align-items-center gap-2">
            <span class="badge ${
              isCompleted ? 'bg-success' : 'bg-warning text-dark'
            } px-3 py-2 rounded-pill status">
              ${isCompleted ? 'Completed' : 'Pending'}
            </span>

            ${
              !isCompleted
                ? `<button type="button" class="btn btn-outline-success btn-sm"
                    onclick="markCompleted(this,'${element._id}')">
                    ✔
                   </button>`
                : ''
            }

      
     </li>

         `
       noteContainer.innerHTML+=note
      
     })
    })
  }


  //for completed button(when clicking getting completed)
  function markCompleted(btn,id) {
  const li = btn.closest("li")
  const status = li.querySelector(".status")
  localStorage.setItem(`task_${id}`,"completed")
   
  // turn card green
  li.style.background = "linear-gradient(135deg,#d4edda,#c3e6cb)"
  li.style.border = "2px solid #28a745"

  // change badge
  status.className = "badge bg-success px-3 py-2 rounded-pill status"
  status.innerText = "Completed"

  // remove button
  btn.remove()
  
}


  const addnote=document.getElementById('addnote')
  addnote.addEventListener("click",async()=>{
    const subject=document.getElementById("subject").value
  const date=document.getElementById("date").value
  const time=document.getElementById("time").value
  
  const email=JSON.parse(localStorage.getItem("user"))?.email
  if(!email){
    alert("login")
    return
  }
  console.log("submitting this data",subject,date,time,email)
  const resp=await postData('/addanote',{subject,date,time,email})
  if(resp.success){
    alert("note created")
    
  }
  })

  async function deleteNote(id){
    if(!confirm("delete this study plan ?"))
    return 

    const res=await fetch(`/deletenotes/${id}`,{
      method:"DELETE"
    })
    const data=await res.json()
    if(data.success){
      location.reload()
    }
  }

 
</script>
</body>
</html>
